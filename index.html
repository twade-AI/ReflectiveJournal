<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Haileybury Odyssey · Reflective Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse 1200px 900px at 50% 0%, rgba(253, 247, 225, 0.9), rgba(253, 247, 225, 0) 70%),
      radial-gradient(ellipse 900px 700px at 100% 40%, rgba(247, 235, 198, 0.55), rgba(247, 235, 198, 0) 70%),
      radial-gradient(ellipse 900px 700px at 0% 80%, rgba(247, 235, 198, 0.55), rgba(247, 235, 198, 0) 70%),
      #f1e7c9;
    background-attachment: fixed;
    color: #1f1d1a;
    font-family: 'Calluna Sans', 'Lato', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input, textarea, select { font-size: 16px; } /* prevent iOS focus-zoom */
  input:focus, textarea:focus, select:focus {
    outline: 2px solid #b9607d;
    outline-offset: 1px;
    border-color: #9b1844 !important;
  }

  /* ── Tablet / phone responsive pass (iPad portrait + below) ── */
  @media (max-width: 960px) {
    .rj-nav-inner { padding: 12px 16px !important; gap: 14px !important; }
    .rj-nav-tabs button { padding: 7px 12px !important; font-size: 11px !important; }
  }
  @media (max-width: 720px) {
    /* Saga: stack the book pages and hide the spine on narrow screens */
    .rj-spread { grid-template-columns: 1fr !important; }
    .rj-spread .rj-spine { display: none !important; }
    .rj-spread .rj-page-left  { border-right: none !important; border-bottom: 1px solid rgba(155,24,68,0.08) !important; padding: 28px 22px !important; min-height: 0 !important; align-self: stretch !important; }
    .rj-spread .rj-page-right { padding: 28px 22px !important; min-height: 0 !important; align-self: stretch !important; }

    /* Card action row wraps under the title rather than overflowing */
    .rj-card-actions { flex-wrap: wrap; }
    .rj-card-actions button { padding: 8px 10px !important; min-height: 40px; }

    /* Hero page tightens up */
    .rj-hero-h1 { font-size: 36px !important; }
    .rj-section-title { font-size: 22px !important; }

    /* Logo banner reduces */
    .rj-hero-logo { max-width: 340px !important; }

    /* Form header save/cancel: full-width on small screens for finger taps */
    .rj-form-header { flex-direction: column; align-items: stretch !important; }
    .rj-form-header .rj-form-actions { justify-content: flex-end; }
  }
  @media (max-width: 480px) {
    .rj-hero-h1 { font-size: 30px !important; }
  }
  /* Hide native number spinners — the NumberStepper has its own +/- controls */
  .num-stepper-input::-webkit-inner-spin-button,
  .num-stepper-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .num-stepper-input:focus { outline: none !important; }

  /* ── Print: hide the app, show the printable book ── */
  .rj-print { display: none; }
  @page { size: A4; margin: 18mm 16mm; }
  @media print {
    html, body { background: #fff !important; }
    body > div#root > div > header,
    body > div#root > div > main > div > :not(.rj-print) { display: none !important; }
    /* Unhide the printable */
    .rj-print { display: block !important; }
    /* Re-show the Book view's container but only the printable inside it */
    body > div#root > div > main {
      max-width: none !important; padding: 0 !important; margin: 0 !important;
    }
    body > div#root > div { background: #fff !important; }
  }
  .rj-print-page { page-break-after: always; break-after: page;
    min-height: 260mm; padding: 6mm 0;
    display: flex; flex-direction: column; }
  .rj-print-page:last-child { page-break-after: auto; break-after: auto; }
  .rj-print-cover { justify-content: center; align-items: center;
    min-height: 260mm; text-align: center; }
  .rj-print-logo {
    height: 28mm; width: auto; display: block; margin: 0 auto 14mm;
  }
  .rj-print-hero {
    width: 100%; max-width: 165mm; height: auto; display: block; margin: 0 auto 14mm;
  }
  .rj-print-eyebrow {
    font-size: 10pt; letter-spacing: 0.32em; text-transform: uppercase;
    color: #9b1844; font-weight: 700; margin-bottom: 10mm;
  }
  .rj-print-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 54pt; font-weight: 700; color: #1f1d1a;
    margin: 0; line-height: 1.05; letter-spacing: -0.02em;
  }
  .rj-print-title em { color: #9b1844; }
  .rj-print-byline {
    margin-top: 10mm; font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-size: 13pt; color: #5f5a52;
  }
  .rj-print-entry { color: #1f1d1a; font-family: 'Calluna Sans', 'Lato', sans-serif; }
  .rj-print-meta {
    font-size: 9pt; letter-spacing: 0.22em; text-transform: uppercase;
    color: #9b1844; font-weight: 700; margin-bottom: 4mm;
  }
  .rj-print-h {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28pt; font-weight: 700; color: #1f1d1a;
    margin: 0 0 4mm; line-height: 1.1; letter-spacing: -0.01em;
  }
  .rj-print-values { margin-bottom: 6mm; }
  .rj-print-tag {
    display: inline-block; padding: 1.2mm 2.5mm; margin: 0 2mm 2mm 0;
    border: 0.4mm solid currentColor; border-radius: 30pt;
    font-size: 8pt; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .rj-print-figure { margin: 4mm 0 6mm; break-inside: avoid; }
  .rj-print-figure img {
    max-width: 100%; max-height: 120mm; display: block;
    border: 0.3mm solid #d4cfc0;
  }
  .rj-print-figure figcaption {
    margin-top: 2mm; font-style: italic; font-size: 10pt; color: #5f5a52;
  }
  .rj-print-section { margin-bottom: 6mm; break-inside: avoid; }
  .rj-print-section-label {
    font-size: 8.5pt; letter-spacing: 0.22em; text-transform: uppercase;
    color: #9b1844; font-weight: 700; margin-bottom: 1.5mm;
  }
  .rj-print-section-body {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 12pt; color: #1f1d1a; line-height: 1.5; white-space: pre-wrap;
  }
  .rj-print-tickets {
    margin-top: 6mm; padding-top: 3mm; border-top: 0.3mm solid #d4cfc0;
    font-size: 10pt; color: #3a3835; display: flex; gap: 10mm;
  }
  .rj-print-mood {
    margin-top: 4mm; font-size: 10pt; color: #3a3835;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="common.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script>
  // Cache-bust JSX files on every load. Browsers ignore script type="text/babel"
  // (wrong MIME), so they don't fetch it themselves — babel-standalone fetches
  // it later from the `src` attribute at DOMContentLoaded. Mutating `src` here
  // runs synchronously during parse, before Babel reads it.
  (function () {
    var v = Date.now();
    document.querySelectorAll('script[type="text/babel"][src]').forEach(function (s) {
      s.src = s.src + (s.src.indexOf('?') === -1 ? '?' : '&') + 'v=' + v;
    });
  })();
</script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
