<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haileybury Reflective Journal — Mockups</title>
<meta name="viewport" content="width=1600">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e8e4d8; font-family: 'Calluna Sans', 'Lato', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="journal-common.jsx"></script>
<script type="text/babel" src="journal-ks3.jsx"></script>
<script type="text/babel" src="journal-ks4.jsx"></script>
<script type="text/babel" src="journal-ks5.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "surface": "dotted",
  "photoSlots": true,
  "filled": true,
  "focusAge": "all"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const surfaceOptions = [
    { value: 'ruled', label: 'Ruled lines' },
    { value: 'dotted', label: 'Dotted grid' },
    { value: 'blank', label: 'Blank' },
  ];

  const focusOptions = [
    { value: 'all', label: 'Show all three' },
    { value: 'ks3', label: 'KS3 only (Years 7–9)' },
    { value: 'ks4', label: 'KS4 only (Years 10–11)' },
    { value: 'ks5', label: 'KS5 only (Sixth Form)' },
  ];

  const showKS3 = tweaks.focusAge === 'all' || tweaks.focusAge === 'ks3';
  const showKS4 = tweaks.focusAge === 'all' || tweaks.focusAge === 'ks4';
  const showKS5 = tweaks.focusAge === 'all' || tweaks.focusAge === 'ks5';

  // Helper — per-page tweaks object with a forced `filled` override
  const tw = (filled) => ({ ...tweaks, filled });

  return (
    <>
      <SurfaceDefs/>

      <DesignCanvas title="Haileybury · Reflective Journal" subtitle="A4 portrait workbook · designed for GoodNotes annotation">

        {showKS3 && (
          <DCSection id="ks3" title="Key Stage 3 · Years 7–9 (ages 11–14)" subtitle="Warmer, more guided. Scrapbook-feel. Emoji-light. Shorter prompts and built-in scaffolding.">
            <DCArtboard id="ks3-cover" label="01 · Cover" width={A4.w} height={A4.h}>
              <KS3Cover tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks3-how" label="02 · How this works" width={A4.w} height={A4.h}>
              <KS3HowToUse tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks3-entry-blank" label="03a · Reflection entry — blank" width={A4.w} height={A4.h}>
              <KS3Entry tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks3-entry" label="03b · Reflection entry — filled" width={A4.w} height={A4.h}>
              <KS3Entry tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks3-checkin-blank" label="04a · Weekly check-in — blank" width={A4.w} height={A4.h}>
              <KS3Checkin tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks3-checkin" label="04b · Weekly check-in — filled" width={A4.w} height={A4.h}>
              <KS3Checkin tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks3-review-blank" label="05a · Term review — blank" width={A4.w} height={A4.h}>
              <KS3TermReview tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks3-review" label="05b · Term review — filled" width={A4.w} height={A4.h}>
              <KS3TermReview tweaks={tw(true)}/>
            </DCArtboard>
          </DCSection>
        )}

        {showKS4 && (
          <DCSection id="ks4" title="Key Stage 4 · Years 10–11 (ages 14–15)" subtitle="Editorial, cream paper, magenta accents. Balanced structure and open space. Introduces 'for tutorial' pages and sharper vocabulary.">
            <DCArtboard id="ks4-cover" label="01 · Cover" width={A4.w} height={A4.h}>
              <KS4Cover tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks4-how" label="02 · Introduction" width={A4.w} height={A4.h}>
              <KS4HowToUse tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks4-entry-blank" label="03a · Reflection entry — blank" width={A4.w} height={A4.h}>
              <KS4Entry tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks4-entry" label="03b · Reflection entry — filled" width={A4.w} height={A4.h}>
              <KS4Entry tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks4-checkin-blank" label="04a · Weekly check-in — blank" width={A4.w} height={A4.h}>
              <KS4Checkin tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks4-checkin" label="04b · Weekly check-in — filled" width={A4.w} height={A4.h}>
              <KS4Checkin tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks4-review-blank" label="05a · Term review — blank" width={A4.w} height={A4.h}>
              <KS4TermReview tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks4-review" label="05b · Term review — filled" width={A4.w} height={A4.h}>
              <KS4TermReview tweaks={tw(true)}/>
            </DCArtboard>
          </DCSection>
        )}

        {showKS5 && (
          <DCSection id="ks5" title="Sixth Form · Years 12–13 (ages 16–18)" subtitle="Minimalist editorial. Long-form. Generous whitespace and serif typography. Essay-like prompts; space for tutor countersignatures.">
            <DCArtboard id="ks5-cover" label="01 · Cover" width={A4.w} height={A4.h}>
              <KS5Cover tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks5-how" label="02 · Prologue" width={A4.w} height={A4.h}>
              <KS5HowToUse tweaks={tweaks}/>
            </DCArtboard>
            <DCArtboard id="ks5-entry-blank" label="03a · Reflection (part one) — blank" width={A4.w} height={A4.h}>
              <KS5Entry tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks5-entry" label="03b · Reflection (part one) — filled" width={A4.w} height={A4.h}>
              <KS5Entry tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks5-entry2-blank" label="04a · Reflection (part two) — blank" width={A4.w} height={A4.h}>
              <KS5Entry2 tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks5-entry2" label="04b · Reflection (part two) — filled" width={A4.w} height={A4.h}>
              <KS5Entry2 tweaks={tw(true)}/>
            </DCArtboard>
            <DCArtboard id="ks5-review-blank" label="05a · Year review — blank" width={A4.w} height={A4.h}>
              <KS5YearReview tweaks={tw(false)}/>
            </DCArtboard>
            <DCArtboard id="ks5-review" label="05b · Year review — filled" width={A4.w} height={A4.h}>
              <KS5YearReview tweaks={tw(true)}/>
            </DCArtboard>
          </DCSection>
        )}

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Age group">
          <TweakRadio
            value={tweaks.focusAge}
            onChange={v => setTweak('focusAge', v)}
            options={focusOptions}/>
        </TweakSection>

        <TweakSection title="Writing surface">
          <TweakRadio
            value={tweaks.surface}
            onChange={v => setTweak('surface', v)}
            options={surfaceOptions}/>
        </TweakSection>

        <TweakSection title="Options">
          <TweakToggle label="Photo / sketch slots"
            checked={tweaks.photoSlots}
            onChange={v => setTweak('photoSlots', v)}/>
          <TweakToggle label="Show sample filled entry"
            checked={tweaks.filled}
            onChange={v => setTweak('filled', v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
